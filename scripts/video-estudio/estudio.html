<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio · Pont3la10</title>
<style>
  :root { --navy: #08204a; --amarillo: #ffd800; --tinta: #111; --gris: #5f6878; --linea: #dbe2ee; --fondo: #f3f5f9; --rojo: #d7263d; --verde: #1f8a4c; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Montserrat, "Segoe UI", Arial, sans-serif; background: var(--fondo); color: var(--tinta); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--navy); color: #fff; }
  header h1 { margin: 0; font-size: 20px; }
  header h1 span { color: var(--amarillo); }
  header select { min-height: 40px; padding: 0 10px; border-radius: 6px; border: 0; font: inherit; }
  #resumen { margin-left: auto; font-size: 14px; opacity: .9; }
  main { display: grid; grid-template-columns: 300px 1fr 340px; gap: 16px; padding: 16px; min-height: calc(100vh - 140px); }
  section.panel { background: #fff; border: 1px solid var(--linea); border-radius: 10px; padding: 14px; overflow: auto; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  #tramos { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #tramos button { width: 100%; text-align: left; display: grid; gap: 2px; padding: 10px; border: 1px solid var(--linea); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
  #tramos button[aria-current="true"] { border-color: var(--navy); box-shadow: 0 0 0 2px #ffd80088; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 800; letter-spacing: .05em; }
  .chip.cara { background: var(--amarillo); color: var(--navy); }
  .chip.voz { background: var(--navy); color: #fff; }
  .estado { font-size: 12px; color: var(--gris); }
  .estado.ok { color: var(--verde); font-weight: 700; }
  #centro { display: grid; grid-template-rows: auto 1fr auto; gap: 12px; }
  #controles, #acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button.boton { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--linea); background: #fff; color: var(--navy); font: inherit; font-weight: 700; cursor: pointer; }
  button.boton.primario { background: var(--navy); color: #fff; border-color: var(--navy); }
  button.boton.grabar { background: var(--rojo); color: #fff; border-color: var(--rojo); }
  button.boton:disabled { opacity: .45; cursor: default; }
  label.control { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  #escenario { position: relative; display: grid; grid-template-columns: 1fr; gap: 12px; }
  #escenario.con-camara { grid-template-columns: 1fr 360px; }
  #prompter { height: 52vh; overflow: hidden; background: #0b0d12; color: #fff; border-radius: 10px; padding: 14vh 48px 40vh; font-size: 46px; font-weight: 700; line-height: 1.45; }
  #prompter.espejo #texto { transform: scaleX(-1); }
  #prompter .marca { position: absolute; }
  #guia { position: absolute; left: 0; right: 0; top: 18vh; height: 3px; background: #ffd80088; pointer-events: none; }
  #camara { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; object-fit: cover; display: none; }
  #escenario.con-camara #camara { display: block; }
  #cuenta { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 160px; font-weight: 900; color: var(--amarillo); background: #0009; border-radius: 10px; }
  #toma { display: grid; gap: 8px; }
  #toma video, #toma audio { width: 100%; max-height: 220px; background: #000; border-radius: 8px; }
  #aviso { min-height: 22px; font-size: 14px; }
  #aviso.error { color: var(--rojo); font-weight: 700; }
  .foto-bloque { border: 1px solid var(--linea); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .foto-bloque h3 { margin: 0 0 4px; font-size: 14px; }
  .miniaturas { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .miniaturas figure { margin: 0; position: relative; }
  .miniaturas img { width: 84px; height: 48px; object-fit: cover; border-radius: 4px; display: block; }
  .miniaturas button { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: #000a; color: #fff; cursor: pointer; }
  .subir { display: grid; gap: 6px; }
  .subir input[type=text] { min-height: 36px; padding: 0 8px; border: 1px solid var(--linea); border-radius: 6px; font: inherit; }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #fff; border-top: 1px solid var(--linea); }
  #registro { font-size: 13px; color: var(--gris); white-space: pre-wrap; max-height: 64px; overflow: auto; flex: 1; }
  #final { width: 100%; max-width: 640px; display: none; border-radius: 8px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } #prompter { height: 40vh; } }
</style>
</head>
<body>
<header>
  <h1>Estudio <span>Pont3la10</span></h1>
  <select id="proyecto" aria-label="Proyecto del día"></select>
  <div id="resumen"></div>
</header>
<main>
  <section class="panel" aria-label="Tramos del video">
    <h2>Tramos</h2>
    <ul id="tramos"></ul>
  </section>
  <section class="panel" id="centro">
    <div id="controles">
      <button class="boton grabar" id="grabar">● Grabar (barra espaciadora)</button>
      <button class="boton" id="detener" disabled>■ Detener</button>
      <button class="boton" id="leer">▶ Solo leer</button>
      <label class="control">Velocidad <input type="range" id="ppm" min="110" max="210" value="155"> <span id="ppm-valor">155</span> ppm</label>
      <label class="control">Letra <input type="range" id="letra" min="28" max="72" value="46"></label>
      <label class="control"><input type="checkbox" id="espejo"> Espejo</label>
    </div>
    <div id="escenario">
      <div style="position: relative">
        <div id="prompter"><div id="texto">Elige un tramo a la izquierda.</div></div>
        <div id="guia"></div>
        <div id="cuenta"></div>
      </div>
      <video id="camara" autoplay muted playsinline></video>
    </div>
    <div id="toma">
      <div id="aviso" role="status"></div>
      <div id="reproductor"></div>
      <div id="acciones">
        <button class="boton primario" id="guardar" disabled>Guardar esta toma</button>
        <button class="boton" id="descartar" disabled>Descartar</button>
        <button class="boton" id="borrar-guardada" disabled>Borrar toma guardada</button>
      </div>
    </div>
  </section>
  <section class="panel" aria-label="Fotos por noticia">
    <h2>Fotos por noticia</h2>
    <p class="estado">Sube fotos reales con su crédito. Llenan los espacios marcados «Espacio para imagen».</p>
    <div id="fotos"></div>
  </section>
</main>
<footer>
  <button class="boton primario" id="armar">Armar video</button>
  <button class="boton" id="render">Renderizar</button>
  <div id="registro"></div>
  <video id="final" controls></video>
</footer>
<script>
const $ = s => document.querySelector(s)
let proyecto = null, detalle = null, tramo = null
let grabador = null, trozos = [], tomaBlob = null, flujo = null, desplazando = null

const api = async (ruta, opciones = {}) => {
  const r = await fetch(ruta, opciones)
  const datos = await r.json().catch(() => ({}))
  if (!r.ok) throw new Error(datos.error || `Error ${r.status}`)
  return datos
}
const aviso = (texto, error = false) => { $('#aviso').textContent = texto; $('#aviso').className = error ? 'error' : '' }
const palabras = t => String(t || '').trim().split(/\s+/).filter(Boolean).length
const seg = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`

async function cargarProyectos() {
  const { proyectos } = await api('/api/proyectos')
  $('#proyecto').innerHTML = proyectos.map(p => `<option value="${p.nombre}">${p.nombre} · ${p.grabados}/${p.tramos} grabados</option>`).join('') || '<option>Sin proyectos: genera uno con el script</option>'
  if (proyectos.length) { proyecto = proyectos[0].nombre; await cargarDetalle() }
}

async function cargarDetalle(mantenerTramo = true) {
  detalle = await api(`/api/proyectos/${proyecto}`)
  const { manifiesto, estudio } = detalle
  const grabados = manifiesto.segmentos.filter(s => estudio.grabaciones?.[s.id]).length
  const vacios = (manifiesto.fotos || []).reduce((s, f) => s + f.vacios, 0)
  $('#resumen').textContent = `${seg(manifiesto.duracion)} · ${grabados}/${manifiesto.segmentos.length} tramos grabados · ${vacios} espacios de foto vacíos`
  $('#tramos').innerHTML = manifiesto.segmentos.map(s => {
    const g = estudio.grabaciones?.[s.id]
    return `<li><button data-id="${s.id}" aria-current="${tramo?.id === s.id}"><span><span class="chip ${s.tipo}">${s.tipo === 'cara' ? 'CARA' : 'VOZ'}</span> ${s.etiqueta}</span><span class="estado ${g ? 'ok' : ''}">${g ? `✓ grabado · ${g.duracion.toFixed(1)} s` : `pendiente · ~${(s.fin - s.inicio).toFixed(0)} s`}</span></button></li>`
  }).join('')
  $('#tramos').querySelectorAll('button').forEach(b => b.addEventListener('click', () => elegirTramo(b.dataset.id)))
  pintarFotos()
  if (detalle.videoFinal) { $('#final').src = detalle.videoFinal; $('#final').style.display = 'block' }
  if (mantenerTramo && tramo) elegirTramo(tramo.id)
  else if (manifiesto.segmentos.length) elegirTramo(manifiesto.segmentos.find(s => !estudio.grabaciones?.[s.id])?.id || manifiesto.segmentos[0].id)
}

function pintarFotos() {
  const { manifiesto, estudio } = detalle
  $('#fotos').innerHTML = (manifiesto.fotos || []).map(f => {
    const subidas = estudio.fotosExtra?.[f.clave] || []
    return `<div class="foto-bloque"><h3>${f.etiqueta.replace(' · voz', '')}</h3>
      <div class="estado">${f.fotos} foto(s) · ${f.espacios} espacios · <strong>${f.vacios} vacíos</strong></div>
      <div class="miniaturas">${subidas.map((s, i) => `<figure><img src="/archivos/${proyecto}/${s.ruta}" alt="" title="${s.credito.replace(/"/g, '&quot;')}"><button data-clave="${f.clave}" data-i="${i}" aria-label="Quitar foto">×</button></figure>`).join('')}</div>
      <form class="subir" data-clave="${f.clave}"><input type="file" accept="image/jpeg,image/png,image/webp" required><input type="text" placeholder="Crédito, p. ej. Colprensa (vía El Tiempo)" required maxlength="120"><button class="boton">Subir foto</button></form></div>`
  }).join('')
  $('#fotos').querySelectorAll('form').forEach(f => f.addEventListener('submit', subirFoto))
  $('#fotos').querySelectorAll('.miniaturas button').forEach(b => b.addEventListener('click', async () => {
    await api(`/api/proyectos/${proyecto}/fotos/${b.dataset.clave}/${b.dataset.i}`, { method: 'DELETE' }); aviso('Foto quitada. Pulsa «Armar video» para aplicarlo.'); await cargarDetalle()
  }))
}

async function subirFoto(e) {
  e.preventDefault()
  const [archivo, credito] = e.target.querySelectorAll('input')
  if (!archivo.files[0]) return
  try {
    aviso('Subiendo foto…')
    await api(`/api/proyectos/${proyecto}/fotos/${e.target.dataset.clave}`, { method: 'POST', headers: { 'content-type': archivo.files[0].type || 'application/octet-stream', 'x-credito': encodeURIComponent(credito.value) }, body: archivo.files[0] })
    aviso('Foto guardada. Pulsa «Armar video» para verla en su espacio.')
    await cargarDetalle()
  } catch (error) { aviso(error.message, true) }
}

async function elegirTramo(id) {
  detenerLectura()
  tramo = detalle.manifiesto.segmentos.find(s => s.id === id)
  document.querySelectorAll('#tramos button').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === id)))
  $('#texto').textContent = tramo.texto
  $('#prompter').scrollTop = 0
  descartarToma()
  const guardada = detalle.estudio.grabaciones?.[id]
  $('#borrar-guardada').disabled = !guardada
  $('#reproductor').innerHTML = guardada ? (guardada.tipo === 'cara' ? `<video controls src="/archivos/${proyecto}/${guardada.archivo}?v=${Date.now()}"></video>` : `<audio controls src="/archivos/${proyecto}/${guardada.archivo}?v=${Date.now()}"></audio>`) : ''
  aviso(guardada ? `Toma guardada de ${guardada.duracion.toFixed(1)} s. Puedes repetirla.` : `${tramo.tipo === 'cara' ? 'Toma a cámara' : 'Solo voz'} · ${palabras(tramo.texto)} palabras`)
  await prepararDispositivos()
}

async function prepararDispositivos() {
  const conCamara = tramo?.tipo === 'cara'
  $('#escenario').classList.toggle('con-camara', conCamara)
  const necesitaVideo = conCamara
  if (flujo && (flujo.getVideoTracks().length > 0) === necesitaVideo) return
  if (flujo) flujo.getTracks().forEach(t => t.stop())
  try {
    flujo = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: necesitaVideo ? { width: { ideal: 1920 }, height: { ideal: 1080 } } : false })
    $('#camara').srcObject = necesitaVideo ? flujo : null
  } catch { aviso('No hay permiso para el micrófono o la cámara. Permítelo en el navegador.', true); flujo = null }
}

function leer() {
  detenerLectura()
  const ppm = Number($('#ppm').value)
  const caja = $('#prompter')
  const total = caja.scrollHeight - caja.clientHeight
  const segundos = Math.max(2, palabras(tramo.texto) / ppm * 60)
  const inicio = performance.now()
  const paso = ahora => {
    const avance = Math.min(1, (ahora - inicio) / 1000 / segundos)
    caja.scrollTop = total * avance
    if (avance < 1) desplazando = requestAnimationFrame(paso)
  }
  caja.scrollTop = 0
  desplazando = requestAnimationFrame(paso)
}
function detenerLectura() { if (desplazando) cancelAnimationFrame(desplazando); desplazando = null }

async function grabar() {
  if (!tramo || grabador) return
  await prepararDispositivos()
  if (!flujo) return
  descartarToma()
  const cuenta = $('#cuenta')
  cuenta.style.display = 'flex'
  for (const n of [3, 2, 1]) { cuenta.textContent = n; await new Promise(r => setTimeout(r, 800)) }
  cuenta.style.display = 'none'
  const tipos = tramo.tipo === 'cara' ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'] : ['audio/webm;codecs=opus', 'audio/webm']
  const mimeType = tipos.find(t => MediaRecorder.isTypeSupported(t)) || ''
  trozos = []
  grabador = new MediaRecorder(flujo, mimeType ? { mimeType } : undefined)
  grabador.ondataavailable = e => { if (e.data.size) trozos.push(e.data) }
  grabador.onstop = () => {
    tomaBlob = new Blob(trozos, { type: grabador.mimeType || 'video/webm' })
    grabador = null
    const url = URL.createObjectURL(tomaBlob)
    $('#reproductor').innerHTML = tramo.tipo === 'cara' ? `<video controls src="${url}"></video>` : `<audio controls src="${url}"></audio>`
    $('#guardar').disabled = false; $('#descartar').disabled = false
    $('#grabar').disabled = false; $('#detener').disabled = true
    aviso('Revisa la toma y guárdala, o graba otra.')
  }
  grabador.start(1000)
  $('#grabar').disabled = true; $('#detener').disabled = false
  aviso('● Grabando… lee el texto a tu ritmo. Barra espaciadora para detener.')
  leer()
}
function detener() { if (grabador) { grabador.stop(); detenerLectura() } }
function descartarToma() { tomaBlob = null; $('#guardar').disabled = true; $('#descartar').disabled = true }

async function guardarToma() {
  if (!tomaBlob) return
  try {
    $('#guardar').disabled = true
    aviso('Guardando y convirtiendo la toma…')
    const r = await api(`/api/proyectos/${proyecto}/grabaciones/${tramo.id}`, { method: 'POST', headers: { 'content-type': tomaBlob.type }, body: tomaBlob })
    aviso(`Toma guardada: ${r.duracion.toFixed(1)} s.`)
    const siguiente = detalle.manifiesto.segmentos[detalle.manifiesto.segmentos.findIndex(s => s.id === tramo.id) + 1]
    await cargarDetalle(false)
    if (siguiente) await elegirTramo(siguiente.id)
  } catch (error) { aviso(error.message, true); $('#guardar').disabled = false }
}

async function borrarGuardada() {
  if (!confirm('¿Borrar la toma guardada de este tramo?')) return
  await api(`/api/proyectos/${proyecto}/grabaciones/${tramo.id}`, { method: 'DELETE' })
  await cargarDetalle()
}

async function armar() {
  $('#armar').disabled = true
  $('#registro').textContent = 'Armando el video con tus tomas y fotos…'
  try {
    const r = await api(`/api/proyectos/${proyecto}/armar`, { method: 'POST' })
    $('#registro').textContent = `Listo: ${seg(r.duracion)} · ${r.grabados}/${r.tramos} tramos grabados · ${r.vacios} espacios de foto vacíos. Ábrelo en la app de HyperFrames para revisarlo o pulsa «Renderizar».`
    await cargarDetalle()
  } catch (error) { $('#registro').textContent = error.message }
  $('#armar').disabled = false
}

async function render() {
  try {
    await api(`/api/proyectos/${proyecto}/render`, { method: 'POST' })
    $('#render').disabled = true
    const sondeo = setInterval(async () => {
      const d = await api(`/api/proyectos/${proyecto}`)
      $('#registro').textContent = d.render?.registro?.split('\n').filter(Boolean).slice(-2).join('\n') || 'Renderizando…'
      if (d.render?.estado !== 'renderizando') {
        clearInterval(sondeo); $('#render').disabled = false
        if (d.render?.estado === 'listo') { $('#final').src = d.videoFinal; $('#final').style.display = 'block'; $('#registro').textContent = 'Video renderizado: renders/final.mp4' }
      }
    }, 4000)
  } catch (error) { $('#registro').textContent = error.message }
}

$('#proyecto').addEventListener('change', async e => { proyecto = e.target.value; tramo = null; await cargarDetalle(false) })
$('#grabar').addEventListener('click', grabar)
$('#detener').addEventListener('click', detener)
$('#leer').addEventListener('click', () => (desplazando ? detenerLectura() : leer()))
$('#guardar').addEventListener('click', guardarToma)
$('#descartar').addEventListener('click', () => { descartarToma(); $('#reproductor').innerHTML = ''; aviso('Toma descartada.') })
$('#borrar-guardada').addEventListener('click', borrarGuardada)
$('#armar').addEventListener('click', armar)
$('#render').addEventListener('click', render)
$('#ppm').addEventListener('input', e => { $('#ppm-valor').textContent = e.target.value })
$('#letra').addEventListener('input', e => { $('#prompter').style.fontSize = `${e.target.value}px` })
$('#espejo').addEventListener('change', e => $('#prompter').classList.toggle('espejo', e.target.checked))
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || ['INPUT', 'TEXTAREA', 'SELECT', 'BUTTON'].includes(e.target.tagName)) return
  e.preventDefault()
  grabador ? detener() : grabar()
})
cargarProyectos().catch(error => aviso(error.message, true))
</script>
</body>
</html>
