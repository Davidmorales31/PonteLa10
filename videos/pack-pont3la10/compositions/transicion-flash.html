<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: transparent; }
    #flash-blanco { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
    #flash-luz { position: absolute; inset: -200px; background: radial-gradient(circle at 30% 40%, rgba(255,216,0,0.85), rgba(255,216,0,0) 55%); opacity: 0; }
  </style>
  <div id="root" data-composition-id="transicion-flash" data-width="1920" data-height="1080">
    <div id="flash-escena" class="clip" data-start="0" data-duration="0.6" data-layout-allow-overflow>
      <div id="flash-luz"></div>
      <div id="flash-blanco"></div>
    </div>
  </div>
  <script>
    // Destello de cámara: sube en 2 cuadros (el corte va en 0,3 s) y se apaga con una luz amarilla.
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#flash-blanco", { opacity: 0 }, { opacity: 0.95, duration: 0.07, ease: "power2.in" }, 0.24);
    tl.to("#flash-blanco", { opacity: 0, duration: 0.24, ease: "power2.out" }, 0.33);
    tl.fromTo("#flash-luz", { opacity: 0, x: -120 }, { opacity: 0.8, x: 0, duration: 0.15, ease: "power2.out" }, 0.2);
    tl.to("#flash-luz", { opacity: 0, x: 160, duration: 0.25, ease: "power2.in" }, 0.35);
    window.__timelines["transicion-flash"] = tl;
  </script>
</template>
