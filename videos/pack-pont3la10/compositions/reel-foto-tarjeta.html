<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #08204a; font-family: "Montserrat", sans-serif; }
    .rtar-fondo { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    .rtar-tinte { position: absolute; inset: 0; background: rgba(8,32,74,.45); }
    .rtar-tarjeta { position: absolute; left: 40px; top: 400px; width: 1000px; height: 562px; border-radius: 22px; overflow: hidden; border: 6px solid #ffffff; box-shadow: 0 30px 80px rgba(0,0,0,.6); background: #000; }
    .rtar-tarjeta-2 { top: 560px; left: 70px; width: 940px; height: 528px; border-color: #ffd800; }
    .rtar-mov { position: absolute; inset: 0; }
    .rtar-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .rtar-credito { position: absolute; right: 180px; top: 1036px; padding: 6px 14px; background: rgba(8,32,74,.82); color: #fff; font-size: 28px; font-weight: 600; border-left: 4px solid #ffd800; }
  </style>
  <div id="root" data-composition-id="reel-foto-tarjeta" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"fondo","type":"string","label":"Fondo desenfocado","default":""},{"id":"foto","type":"string","label":"Foto","default":""},{"id":"credito","type":"string","label":"Crédito","default":""},{"id":"foto2","type":"string","label":"Segunda foto (opcional, entra a mitad)","default":""},{"id":"duracion","type":"number","label":"Duración (s)","default":4,"min":0.6,"max":12,"step":0.1}]'>
    <div id="rtar-escena" class="clip" data-start="0" data-duration="4">
      <img id="rtar-fondo" class="rtar-fondo" src="assets/vacio.png" data-var-src="fondo" alt="" />
      <div id="rtar-tinte" class="rtar-tinte" data-layout-allow-occlusion></div>
      <div id="rtar-tarjeta" class="rtar-tarjeta"><div id="rtar-mov" class="rtar-mov" data-layout-allow-overflow><img id="rtar-img" class="rtar-img" src="assets/vacio.png" data-var-src="foto" alt="" /></div></div>
      <div id="rtar-tarjeta-2" class="rtar-tarjeta rtar-tarjeta-2" data-layout-allow-overlap><div id="rtar-mov-2" class="rtar-mov" data-layout-allow-overflow><img id="rtar-img-2" class="rtar-img" src="assets/vacio.png" data-var-src="foto2" alt="" /></div></div>
      <div id="rtar-credito" class="rtar-credito" data-var-text="credito"></div>
    </div>
  </div>
  <script>
    // Foto completa en tarjeta sobre su propio fondo desenfocado (no se recorta la escena); si hay segunda foto,
    // cae encima a mitad del plano como una pila de fotos.
    const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
    const D = Math.max(0.6, Number(v.duracion ?? 4));
    const hayDos = Boolean(String(v.foto2 ?? "").trim()) && D > 2.4;
    if (!hayDos) document.querySelector("#rtar-tarjeta-2").style.display = "none";
    if (!String(v.credito ?? "").trim()) document.querySelector("#rtar-credito").style.display = "none";
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#rtar-fondo", { scale: 1.1 }, { scale: 1.2, duration: D, ease: "none" }, 0);
    tl.fromTo("#rtar-tarjeta", { y: 160, rotation: -6, scale: 0.86, opacity: 0 }, { y: 0, rotation: -2, scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 0);
    tl.fromTo("#rtar-mov", { scale: 1.02 }, { scale: 1.14, duration: D, ease: "none" }, 0);
    if (hayDos) {
      tl.to("#rtar-tarjeta", { y: -160, rotation: -5, scale: 0.92, duration: 0.35, ease: "power3.out" }, D / 2);
      tl.fromTo("#rtar-tarjeta-2", { y: 500, rotation: 8, opacity: 0 }, { y: 0, rotation: 3, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, D / 2);
      tl.fromTo("#rtar-mov-2", { scale: 1.02 }, { scale: 1.12, duration: D / 2, ease: "none" }, D / 2);
    }
    tl.fromTo("#rtar-credito", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.25);
    window.__timelines["reel-foto-tarjeta"] = tl;
  </script>
</template>
