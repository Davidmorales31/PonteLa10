<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Montserrat", sans-serif; }
    .rgan-escena { position: absolute; inset: 0; background: #08204a; }
    .rgan-mov { position: absolute; inset: 0; transform-origin: 50% 40%; }
    .rgan-img { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    .rgan-sombra { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.35) 30%, rgba(0,0,0,0) 50%, rgba(0,0,0,0) 72%, rgba(0,0,0,.5) 100%); }
    .rgan-caja { position: absolute; left: 100px; right: 180px; top: 300px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
    .rgan-etiqueta { padding: 10px 22px; background: #ffd800; color: #08204a; font-weight: 900; font-size: 36px; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; }
    .rgan-texto { font-family: "League Gothic", "Oswald", sans-serif; font-size: 112px; line-height: .92; color: #ffffff; text-transform: uppercase; text-shadow: 0 4px 0 rgba(0,0,0,.85), 0 0 30px rgba(0,0,0,.55); }
    .rgan-texto .rgan-p { display: inline-block; margin-right: .18em; }
    .rgan-texto .rgan-p.resaltada { color: #ffd800; }
    .rgan-credito { position: absolute; right: 180px; top: 1262px; color: rgba(255,255,255,.9); font-size: 22px; font-weight: 600; letter-spacing: .01em; text-shadow: 0 1px 2px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.6); }
    .rgan-flash { position: absolute; inset: 0; background: #ffffff; opacity: 0; }
  </style>
  <div id="root" data-composition-id="reel-gancho" data-width="1080" data-height="1920"
    data-composition-variables='[{"id":"foto","type":"string","label":"Foto (real, con crédito)","default":""},{"id":"credito","type":"string","label":"Crédito","default":""},{"id":"texto","type":"string","label":"Texto del gancho (3–7 palabras)","default":"SE QUEDÓ CON TRES JUGADORES"},{"id":"resaltar","type":"string","label":"Palabra en amarillo","default":"TRES"},{"id":"etiqueta","type":"string","label":"Club o tema","default":"DEPORTIVO PASTO"},{"id":"soloTexto","type":"boolean","label":"Solo texto (sobre tu toma a cámara)","default":false},{"id":"foco","type":"string","label":"Foco de la foto (x% y%)","default":"50% 35%"},{"id":"duracion","type":"number","label":"Duración (s)","default":3,"min":0.6,"max":10,"step":0.1}]'>
    <div id="rgan-escena" class="clip rgan-escena" data-start="0" data-duration="3">
      <div id="rgan-mov" class="rgan-mov"><img id="rgan-img" class="rgan-img" src="assets/vacio.png" data-var-src="foto" alt="" /></div>
      <div id="rgan-sombra" class="rgan-sombra" data-layout-allow-occlusion></div>
      <div id="rgan-flash" class="rgan-flash" data-layout-allow-occlusion></div>
      <div id="rgan-caja" class="rgan-caja">
        <div id="rgan-etiqueta" class="rgan-etiqueta" data-var-text="etiqueta">DEPORTIVO PASTO</div>
        <div id="rgan-texto" class="rgan-texto">SE QUEDÓ CON TRES JUGADORES</div>
      </div>
      <div id="rgan-credito" class="rgan-credito" data-var-text="credito"></div>
    </div>
  </div>
  <script>
    // Gancho del Reel: el cuadro 0 ya muestra el texto (es la miniatura). La foto entra con un golpe de zoom
    // y sigue empujando; la palabra clave late en amarillo.
    const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
    const D = Math.max(0.6, Number(v.duracion ?? 3));
    const resaltar = String(v.resaltar ?? "").trim().toUpperCase();
    const caja = document.querySelector("#rgan-texto");
    const palabras = String(v.texto ?? caja.textContent).trim().toUpperCase().split(/\s+/).filter(Boolean);
    caja.textContent = "";
    palabras.forEach((p, i) => {
      const span = document.createElement("span");
      span.className = "rgan-p" + (resaltar && p.replace(/[^\wÁÉÍÓÚÑÜ]/g, "") === resaltar.replace(/[^\wÁÉÍÓÚÑÜ]/g, "") ? " resaltada" : "");
      span.id = "rgan-p" + (i + 1);
      span.textContent = p;
      caja.appendChild(span);
    });
    if (v.soloTexto === true || v.soloTexto === "true") { document.querySelector("#rgan-mov").style.display = "none"; document.querySelector("#rgan-escena").style.background = "transparent"; document.querySelector("#rgan-sombra").style.display = "none"; document.querySelector("#rgan-credito").style.display = "none"; }
    if (!String(v.foto ?? "").trim()) document.querySelector("#rgan-img").style.display = "none";
    if (!String(v.credito ?? "").trim()) document.querySelector("#rgan-credito").style.display = "none";
    document.querySelector("#rgan-img").style.objectPosition = String(v.foco ?? "50% 35%");
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#rgan-mov", { scale: 1.1 }, { keyframes: [{ scale: 1.24, duration: 0.1, ease: "power2.in" }, { scale: 1.1, duration: 0.22, ease: "expo.out" }] }, 0.05);
    tl.to("#rgan-mov", { keyframes: [{ x: -14, y: 6, duration: 0.04 }, { x: 10, y: -8, duration: 0.04 }, { x: -6, y: 4, duration: 0.04 }, { x: 0, y: 0, duration: 0.05 }] }, 0.05);
    tl.to("#rgan-mov", { scale: 1.18, duration: Math.max(0.2, D - 0.37), ease: "none" }, 0.37);
    // Sin destello en el cuadro 0: ese cuadro es la miniatura y debe verse nítido.
    tl.fromTo("#rgan-flash", { opacity: 0 }, { keyframes: [{ opacity: 0.35, duration: 0.05 }, { opacity: 0, duration: 0.2 }] }, 0.08);
    tl.fromTo("#rgan-texto", { scale: 1 }, { keyframes: [{ scale: 1.05, duration: 0.1 }, { scale: 1, duration: 0.25, ease: "back.out(2)" }], transformOrigin: "0% 50%" }, 0.05);
    tl.fromTo("#rgan-etiqueta", { scale: 1 }, { scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%" }, 0.12);
    const resaltadas = [...caja.querySelectorAll(".resaltada")];
    if (resaltadas.length) tl.fromTo(resaltadas, { scale: 1 }, { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1, ease: "power2.inOut" }, 0.45);
    tl.fromTo("#rgan-credito", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
    window.__timelines["reel-gancho"] = tl;
  </script>
</template>
