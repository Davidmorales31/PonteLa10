  <script>
    // Falla digital corta (franjas de color que saltan): marca un giro o un rehook.
    const tl = gsap.timeline({ paused: true });

    ["#rgli-b1", "#rgli-b2", "#rgli-b3", "#rgli-b4"].forEach((id, i) => {
