<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #061733; font-family: "Montserrat", sans-serif; }
    #dfic-fondo { position: absolute; inset: -40px; }
    #dfic-img { position: absolute; left: 0; top: 0; width: 2000px; height: 1160px; object-fit: cover; filter: blur(12px) brightness(0.36) saturate(0.7); }
    .dfic-tinte { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(8,32,74,0.55) 0%, rgba(6,23,51,0.92) 75%); }
    #dfic-fila { position: absolute; left: 120px; right: 120px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
    .dfic-item { flex: 1 1 0; padding: 0 40px; text-align: center; border-left: 3px solid rgba(255,216,0,0.55); opacity: 0; }
    .dfic-item:first-child { border-left: none; }
    .dfic-valor { color: #ffd800; font-size: 190px; font-weight: 900; line-height: 1; letter-spacing: -0.03em; }
    .dfic-etiqueta { margin-top: 18px; color: #ffffff; font-size: 46px; font-weight: 800; letter-spacing: 0.06em; line-height: 1.15; }
    .dfic-solo { color: #ffffff; font-size: 88px; font-weight: 900; line-height: 1.05; letter-spacing: 0.02em; }
    #dfic-marca { position: absolute; right: 96px; top: 60px; width: 190px; height: auto; opacity: 0.85; }
  </style>
  <div id="root" data-composition-id="doc-ficha" data-width="1920" data-height="1080"
    data-composition-variables='[{"id":"items","type":"string","label":"Datos (JSON: [{valor, etiqueta}])","default":"[{\"valor\":\"0-0\",\"etiqueta\":\"\"},{\"valor\":\"7\",\"etiqueta\":\"ATAJADAS\"},{\"valor\":\"40\",\"etiqueta\":\"AÑOS\"}]"},{"id":"fondo","type":"string","label":"Foto de fondo (desenfocada)","default":""},{"id":"duracion","type":"number","label":"Duración (s)","default":6,"min":3,"max":12,"step":0.1}]'>
    <div id="dfic-escena" class="clip" data-start="0" data-duration="6" data-layout-allow-occlusion>
      <div id="dfic-fondo" data-layout-allow-occlusion><img id="dfic-img" src="assets/vacio.png" data-var-src="fondo" alt="" /></div>
      <div class="dfic-tinte" data-layout-allow-occlusion></div>
      <div id="dfic-fila"></div>
      <img id="dfic-marca" src="assets/logo-blanco.png" alt="" />
    </div>
  </div>
  <script>
    // Ficha de datos: de 1 a 4 cifras grandes, una tras otra; las cifras enteras pequeñas cuentan desde cero.
    const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
    const D = Math.max(3, Number(v.duracion ?? 6));
    if (!String(v.fondo ?? "").trim()) document.querySelector("#dfic-img").style.display = "none";
    let items = [];
    try { items = JSON.parse(v.items || "[]"); } catch (e) { items = []; }
    items = items.slice(0, 4);
    const fila = document.querySelector("#dfic-fila");
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#dfic-fondo", { scale: 1.0 }, { scale: 1.07, duration: D, ease: "none" }, 0);
    const paso = Math.min(0.9, (D * 0.5) / Math.max(1, items.length));
    items.forEach((item, i) => {
      const caja = document.createElement("div");
      caja.className = "dfic-item";
      const valor = String(item.valor || "");
      const etiqueta = String(item.etiqueta || "");
      if (valor) {
        const num = document.createElement("div");
        num.className = "dfic-valor";
        num.textContent = valor;
        caja.appendChild(num);
        if (/^\d{1,3}$/.test(valor)) {
          const c = { n: 0 };
          tl.fromTo(c, { n: 0 }, { n: Number(valor), duration: 0.9, ease: "power3.out", onUpdate: () => { num.textContent = String(Math.round(c.n)); } }, 0.3 + i * paso);
        }
      }
      if (etiqueta) {
        const et = document.createElement("div");
        et.className = valor ? "dfic-etiqueta" : "dfic-solo";
        et.textContent = etiqueta;
        caja.appendChild(et);
      }
      fila.appendChild(caja);
      tl.fromTo(caja, { opacity: 0, y: 50, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 0.25 + i * paso);
    });
    tl.to("#dfic-fila", { opacity: 0, duration: 0.35, ease: "power2.in" }, D - 0.4);
    window.__timelines["doc-ficha"] = tl;
  </script>
</template>
