<template>
  <style>

  <script>
    // Cita en pantalla: las palabras aparecen una a una y debajo va siempre quién lo dijo y según qué medio.
    const v = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
    const D = Math.max(3, Number(v.duracion ?? 7));
    if (!String(v.fondo ?? "").trim()) document.querySelector("#dcit-img").style.display = "none";
    const caja = document.querySelector("#dcit-texto");
    const palabras = String(v.texto ?? "Todo valió la pena").trim().split(/\s+/);

    tl.fromTo("#dcit-fondo", { scale: 1.0 }, { scale: 1.08, duration: D, ease: "none" }, 0);

    window.__timelines["doc-cita"] = tl;
