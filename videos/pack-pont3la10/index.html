<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #08204a; --ink: #ffffff; --font-display: "Montserrat", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #muestra-foto-b { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    </style>
  </head>
  <body>
    <!-- Muestrario del pack de assets del video diario. Cada escena de compositions/ es reutilizable por el generador. -->

      <div id="plano-foto" data-composition-id="plano-foto" data-composition-src="compositions/plano-foto.html" data-start="4.1" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <img id="muestra-foto-b" class="clip" src="assets/foto-b.jpg" alt="" data-start="25.1" data-duration="4.5" data-track-index="2" style="z-index: 1" />

</html>
