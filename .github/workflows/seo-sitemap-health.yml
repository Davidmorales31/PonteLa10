name: SEO sitemap health

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit production sitemaps and redirects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEO_SITE_URL: https://www.pont3la10.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit public routes
        run: npm run seo:auditar-sitemaps
