name: Bug
description: Reportar un problema reproducible
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripcion
      description: Que esta pasando y que esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos Para Reproducir
      description: Lista los pasos con claridad.
      placeholder: |
        1. Ir a...
        2. Hacer clic en...
        3. Ver error...
    validations:
      required: true
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Navegador, pantalla, datos de prueba o capturas.
    validations:
      required: false
